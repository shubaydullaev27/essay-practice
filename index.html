<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Essay Practice — Upper-Intermediate</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--black:#141416;--black-soft:#232327;--yellow:#FFD530;--yellow-deep:#E7BC12;--white:#fff;--paper:#F6F6F3;--panel:#fff;--ink:#1B1B1D;--ink-soft:#5B5C60;--rule:#E4E3DC;--good:#1E8F52;--good-bg:#E6F5EB;--bad:#D1382F;--bad-bg:#FBEAE8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Public Sans',sans-serif;line-height:1.55;font-size:16px;padding:clamp(16px,4vw,48px) clamp(12px,3vw,20px) 80px}
.sheet{max-width:780px;margin:0 auto;background:var(--panel);border-radius:6px;overflow:hidden;box-shadow:0 1px 0 rgba(20,20,22,.04),0 24px 48px -30px rgba(20,20,22,.35)}
.masthead{background:var(--black);color:#fff;padding:clamp(24px,5vw,40px) clamp(20px,5vw,44px) clamp(20px,4vw,26px);position:relative}
.dot-motif{position:absolute;top:20px;right:24px;display:grid;grid-template-columns:repeat(3,7px);gap:6px}
.dot-motif span{width:7px;height:7px;border-radius:50%;background:var(--yellow)}
.dot-motif span:nth-child(5){background:#fff}
.eyebrow-row{font-size:12.5px;color:rgba(255,255,255,.6);margin-bottom:14px;padding-right:50px}
.brand{color:var(--yellow);font-weight:600}
h1{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(26px,6vw,38px);line-height:1.1;margin:0 0 8px;letter-spacing:-.01em}
.sub{font-size:clamp(13.5px,3vw,15px);color:rgba(255,255,255,.72);margin:0;max-width:58ch}
.progress-bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:12px clamp(16px,5vw,44px);background:var(--black-soft);border-bottom:2px solid var(--yellow);font-size:12.5px;color:rgba(255,255,255,.65)}
.progress-track{flex:1;height:6px;background:rgba(255,255,255,.16);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;width:0;background:var(--yellow);transition:width .35s ease}
.tally{color:#fff;font-weight:700;font-size:13px;white-space:nowrap}
.jump-nav{display:flex;gap:8px;overflow-x:auto;padding:10px clamp(16px,5vw,44px);background:var(--panel);border-bottom:1px solid var(--rule)}
.jump-nav a{flex:0 0 auto;font-size:12.5px;font-weight:700;color:var(--ink-soft);text-decoration:none;padding:7px 12px;border-radius:20px;border:1.5px solid var(--rule);white-space:nowrap}
.jump-nav a:hover{color:var(--ink);border-color:var(--ink-soft)}
.jump-nav a.done{background:var(--yellow);border-color:var(--yellow);color:var(--black)}
section.block{padding:clamp(22px,5vw,34px) clamp(18px,5vw,44px);border-bottom:1px solid var(--rule);scroll-margin-top:60px}
section.block:last-of-type{border-bottom:none}
.rnum{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px}
h2{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(20px,4vw,24px);margin:0 0 16px;position:relative;padding-bottom:8px}
h2::after{content:"";position:absolute;left:0;bottom:0;width:34px;height:4px;background:var(--yellow);border-radius:2px}
.prompt{border:1.5px solid var(--black);border-radius:6px;padding:clamp(14px,3vw,22px);background:#fff;font-size:16px;line-height:1.7;margin-bottom:14px}
.essay{width:100%;min-height:260px;resize:vertical;font-family:'Public Sans',sans-serif;font-size:16px;line-height:1.7;padding:14px 16px;border:1.5px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink)}
.essay:focus{outline:none;border-color:var(--black);box-shadow:0 0 0 3px var(--yellow);background:#fff}
.meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-soft);margin-top:6px}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
button{font-family:'Public Sans',sans-serif;font-size:14px;font-weight:700;border-radius:5px;padding:12px 20px;cursor:pointer;border:1.5px solid transparent;min-height:44px}
button:active{transform:translateY(1px)}
button:disabled{opacity:.55;cursor:wait}
.btn-check{background:var(--yellow);color:var(--black)}
.btn-check:hover:not(:disabled){background:var(--yellow-deep)}
.btn-ghost{background:transparent;color:var(--ink-soft);border-color:var(--rule)}
.btn-ghost:hover{color:var(--ink);border-color:var(--ink-soft)}
.msg{font-size:13px;font-weight:600;margin-top:14px;color:var(--ink-soft)}
.msg.bad{color:var(--bad)}.msg.good{color:var(--good)}
.result{margin-top:18px}
.summary-line{font-size:14.5px;background:var(--good-bg);color:#145c36;border-radius:6px;padding:12px 14px;margin-bottom:12px}
.gx-wrap{border:1px solid var(--rule);border-radius:10px;overflow:auto}
.gx{width:100%;border-collapse:collapse;min-width:520px}
.gx th{background:var(--black);color:var(--yellow);text-align:left;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:11px 14px;border-bottom:2px solid var(--yellow)}
.gx td{padding:10px 14px;font-size:13.5px;border-top:1px solid var(--rule);vertical-align:top}
.gx tr:nth-child(even) td{background:#FAFAF9}
.wrong{font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:600;color:var(--bad);background:var(--bad-bg);padding:2px 6px;border-radius:4px}
.right{font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:600;color:var(--good);background:var(--good-bg);padding:2px 6px;border-radius:4px}
.kind{display:block;font-size:11.5px;color:var(--ink-soft);margin-top:4px}
footer.note{max-width:780px;margin:18px auto 0;font-size:12px;color:var(--ink-soft);text-align:center}
@media(max-width:620px){.controls{flex-direction:column}.controls button{width:100%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style></head><body>
<div class="sheet">
<div class="masthead"><div class="dot-motif"><span></span><span></span><span></span><span></span><span></span><span></span></div>
<div class="eyebrow-row"><span class="brand">English Practice Sheet</span> · Upper-Intermediate</div>
<h1>Essay Practice</h1>
<p class="sub">Choose a topic, write your essay, then press Check my essay. The AI will show your grammar mistakes and how to fix them.</p></div>
<div class="progress-bar"><span>Checked</span><div class="progress-track"><div class="progress-fill" id="fill"></div></div><span class="tally" id="tally"></span></div>
<div class="jump-nav" id="nav"></div>
<section class="block" id="who"><label class="rnum" for="stuName">Your name</label><input id="stuName" class="essay" style="min-height:0;height:48px;resize:none" placeholder="Write your full name" autocomplete="name"></section>
<div id="topics"></div>
</div>
<footer class="note">Your essay is saved in this browser and sent to your teacher when you press Check my essay.</footer>

<script>
/* ===== EDIT THESE TWO THINGS ===== */
var API_URL = "https://bitter-thunder-6c8bessay-checker.sh-ubaydullaev27.workers.dev/";   // your Cloudflare Worker URL (see worker.js)
var LEVEL = "Upper-intermediate";
var TASK = ["write if you agree or disagree with this statement","give detailed reasons that can support your opinion","give an example and/or a suggestion and/or a recommendation"];
var TOPICS = [
  {title:"Investing in education", prompt:"Investing in education is very important.", min:200},
  {title:"Phones in schools", prompt:"Using a phone should be banned in schools.", min:200},
  {title:"Social networks and communication", prompt:"Social networks (Telegram, Instagram etc.) influences the way people communicate.", min:200},
  {title:"Dependence on mobile phones", prompt:"Nowadays people are becoming increasingly dependent on mobile phones.", min:200},
  {title:"Travel and cultures", prompt:"Traveling is the best way to learn about different cultures.", min:200},
  {title:"Creativity and technical skills", prompt:"Creativity is as important as technical skills in the workplace.", min:200},
  {title:"Watching the news", prompt:"People should avoid watching too much news.", min:200}
];
/* ================================= */

var KEY="essay_platform_v1", store={};
try{store=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function words(t){return t.trim()?t.trim().split(/\s+/).length:0}

var nm=document.getElementById("stuName");nm.value=store.name||"";nm.addEventListener("input",function(){store.name=nm.value;save()});
var nav=document.getElementById("nav"), box=document.getElementById("topics");
TOPICS.forEach(function(t,i){
  var id="t"+i, s=store[id]||{};
  nav.insertAdjacentHTML("beforeend",'<a href="#section-'+id+'" id="nav-'+id+'">'+(i+1)+'</a>');
  box.insertAdjacentHTML("beforeend",
   '<section class="block" id="section-'+id+'"><div class="rnum">Topic '+(i+1)+'</div><h2>'+esc(t.title)+'</h2>'+
   '<div class="prompt"><strong>'+esc(t.prompt)+'</strong><div style="margin-top:10px;font-size:14.5px">In your essay, you should:</div><ul style="margin:6px 0 0;padding-left:20px;font-size:14.5px">'+TASK.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></div>'+
   '<textarea class="essay" id="ta-'+id+'" placeholder="Write your essay here…" spellcheck="false"></textarea>'+
   '<div class="meta"><span id="wc-'+id+'"></span><span>Minimum '+t.min+' words</span></div>'+
   '<div class="controls"><button class="btn-check" id="chk-'+id+'">Check my essay</button><button class="btn-ghost" id="clr-'+id+'">Clear</button></div>'+
   '<div class="msg" id="msg-'+id+'"></div><div class="result" id="res-'+id+'"></div></section>');
  var ta=document.getElementById("ta-"+id); ta.value=s.text||"";
  ta.addEventListener("input",function(){store[id]=store[id]||{};store[id].text=ta.value;save();count(id,t)});
  document.getElementById("chk-"+id).onclick=function(){check(id,t)};
  document.getElementById("clr-"+id).onclick=function(){if(!ta.value||confirm("Clear this essay?")){ta.value="";store[id]={};save();count(id,t);document.getElementById("res-"+id).innerHTML="";document.getElementById("msg-"+id).textContent="";progress()}};
  count(id,t); if(s.result)render(id,s.result);
});
progress();

function count(id,t){var n=words(document.getElementById("ta-"+id).value);document.getElementById("wc-"+id).textContent=n+" words"}
function progress(){var d=0;TOPICS.forEach(function(t,i){var id="t"+i,ok=store[id]&&store[id].done;if(ok)d++;document.getElementById("nav-"+id).classList.toggle("done",!!ok)});
  document.getElementById("fill").style.width=(TOPICS.length?d/TOPICS.length*100:0)+"%";document.getElementById("tally").textContent=d+" / "+TOPICS.length}

function render(id,r){
  var errs=r.errors||[], h="";
  if(r.summary)h+='<div class="summary-line">'+esc(r.summary)+'</div>';
  if(!errs.length)h+='<div class="msg good">No grammar mistakes found. Great work!</div>';
  else{h+='<div class="msg">'+errs.length+' mistake'+(errs.length>1?'s':'')+' found</div><div class="gx-wrap"><table class="gx"><thead><tr><th>Your sentence</th><th>Correction</th><th>Why</th></tr></thead><tbody>';
    errs.forEach(function(e){h+='<tr><td><span class="wrong">'+esc(e.original)+'</span><span class="kind">'+esc(e.type)+'</span></td><td><span class="right">'+esc(e.correction)+'</span></td><td>'+esc(e.explanation)+'</td></tr>'});
    h+='</tbody></table></div>'}
  document.getElementById("res-"+id).innerHTML=h;
}

async function check(id,t){
  var ta=document.getElementById("ta-"+id), msg=document.getElementById("msg-"+id), btn=document.getElementById("chk-"+id), n=words(ta.value);
  msg.className="msg";
  var who=nm.value.trim();
  if(!who){msg.className="msg bad";msg.textContent="Write your name at the top first.";document.getElementById("who").scrollIntoView({behavior:"smooth"});nm.focus();return}
  if(n<20){msg.textContent="Write a little more first — at least 20 words.";return}
  if(API_URL.indexOf("http")!==0){msg.className="msg bad";msg.textContent="The checker is not connected yet. Ask your teacher.";return}
  btn.disabled=true;btn.textContent="Checking…";msg.textContent="The AI is reading your essay. This takes a few seconds.";
  try{
    var r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:who,title:t.title,topic:t.prompt,level:LEVEL,words:n,essay:ta.value})});
    if(!r.ok)throw new Error("Server error "+r.status);
    var d=await r.json(), txt=(d.text||"").replace(/```json|```/g,"").trim(), res=null;
    if(txt){try{res=JSON.parse(txt)}catch(e){}}
    store[id]=store[id]||{};store[id].text=ta.value;store[id].done=true;store[id].result=res;save();
    if(res)render(id,res);else document.getElementById("res-"+id).innerHTML="";
    msg.className="msg good";msg.textContent="Your essay was sent to your teacher.";
    progress();
    document.getElementById("res-"+id).scrollIntoView({behavior:"smooth",block:"nearest"});
  }catch(e){msg.className="msg bad";msg.textContent="Your essay was not sent. Check your internet and try again."}
  btn.disabled=false;btn.textContent="Check my essay";
}
</script></body></html>
